<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Маркетплейс</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">Маркетплейс</div>
    <div class="search">
      <input type="text" placeholder="Поиск товаров..." />
    </div>
  </header>

  <div class="container">
    <h2 class="section-title">Популярные товары</h2>
    <div class="grid">
      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="Товар 1" />
        <h3>Беспроводные наушники</h3>
        <p>Цена: 4 990 ₽</p>
        <a href="#" class="btn">В корзину</a>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="Товар 2" />
        <h3>Умные часы</h3>
        <p>Цена: 6 990 ₽</p>
        <a href="#" class="btn">В корзину</a>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="Товар 3" />
        <h3>Портативная колонка</h3>
        <p>Цена: 3 490 ₽</p>
        <a href="#" class="btn">В корзину</a>
      </div>
    </div>
  </div>

</body>
</html>
